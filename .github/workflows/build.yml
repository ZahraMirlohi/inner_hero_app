name: Build APK

on:
  push:
    branches: [ main, master ]
  pull_request:
    branches: [ main, master ]

jobs:
  build:
    runs-on: ubuntu-latest
    
    steps:
    - name: Checkout code
      uses: actions/checkout@v4
    
    - name: Setup Flutter
      uses: subosito/flutter-action@v2
      with:
        flutter-version: '3.29.0'
        channel: 'stable'
        cache: false
    
    - name: Setup Java
      uses: actions/setup-java@v4
      with:
        distribution: 'zulu'
        java-version: '17'
        cache: 'gradle'
    
    - name: Clean caches
      run: |
        flutter clean
        rm -rf android/.gradle
        rm -rf android/app/build
    
    - name: Get dependencies
      run: flutter pub get
    
    - name: Build APK
      run: |
        # دانلودهای گرادل گاهی از گیت‌هاب ارور ۵۰۴ می‌دهند؛ تا ۴ بار تلاش مجدد
        for i in 1 2 3 4; do
          flutter build apk --release \
            --dart-define=SUPABASE_URL=${{ secrets.SUPABASE_URL }} \
            --dart-define=SUPABASE_ANON_KEY=${{ secrets.SUPABASE_ANON_KEY }} && exit 0
          echo "Build attempt $i failed, retrying in 30s..."
          sleep 30
        done
        exit 1
    
    - name: Upload APK
      uses: actions/upload-artifact@v4
      with:
        name: app-release
        path: build/app/outputs/flutter-apk/app-release.apk